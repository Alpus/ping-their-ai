<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message access</title>
<style>
:root {
  color-scheme: light dark;
  font: 16px/1.5 var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  color: var(--color-text-primary, light-dark(#262622, #f4f3ee));
  --muted: var(--color-text-secondary, light-dark(#626258, #b9b8b0));
  --line: var(--color-border-secondary, light-dark(#d9d7cd, #57574f));
}
* { box-sizing: border-box; }
body { margin: 0; background: transparent; }
.connect-panel { padding: clamp(20px, 5vw, 32px); overflow-wrap: anywhere; }
h2 { margin: 0; font-size: clamp(21px, 4.5vw, 26px); font-weight: 560; line-height: 1.2; letter-spacing: -.035em; text-wrap: pretty; }
p { margin: 0; }
#detail:not(:empty), #link-wrap:not([hidden]) { margin-top: 14px; }
#detail { font-size: 14px; color: var(--muted); }
.message-preview { margin: 20px 0; border-left: 2px solid var(--line); padding: 4px 0 4px 16px; }
.message-preview strong { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
blockquote { margin: 5px 0 0; max-height: 12rem; overflow: auto; line-height: 1.5; }
blockquote { white-space: pre-wrap; }
.approval-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
button { min-height: 40px; padding: 8px 15px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.35; color: inherit; background: transparent; cursor: pointer; }
button.primary { background: var(--color-text-primary, light-dark(#272722, #f4f3ee)); border-color: transparent; color: var(--color-background-primary, light-dark(white, #22221f)); }
button.tertiary { border-color: transparent; text-decoration: underline; text-underline-offset: 3px; color: var(--muted); }
button:enabled:hover { filter: brightness(.9); }
button:disabled { opacity: .55; }
:where(button,a):focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.scope-note { margin-top: 13px; max-width: 56ch; color: var(--muted); font-size: 12px; line-height: 1.5; }
a { color: inherit; text-underline-offset: 3px; }
[hidden] { display: none !important; }
@media (max-width: 380px) {
  .approval-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  button.tertiary { grid-column: 1 / -1; justify-self: center; }
}
</style></head><body><main class="connect-panel" id="card" hidden>
<h2 id="title">Message</h2><p id="detail" aria-live="polite"></p>
<div id="preview" class="message-preview" hidden><strong id="from"></strong><blockquote id="quote" dir="auto"></blockquote></div>
<div id="actions" class="approval-actions" hidden>
  {{if .}}<button class="primary" data-decision="allow_message">Allow this message</button>{{else}}<button class="primary" data-decision="once">Allow once</button>{{end}}
  <button id="always" data-decision="always">Always allow</button><button class="tertiary" data-decision="later">Dismiss</button>
</div>
<p id="scope" class="scope-note" hidden>{{if .}}Allow this message lets all your AIs read it now and later. {{end}}Always allow shares this sender’s past and future messages with all your AIs.</p>
<p id="link-wrap" hidden><a id="open" target="_blank" rel="noopener noreferrer">Open in browser</a></p>
</main>
<script>
"use strict";
const el = (id) => document.getElementById(id);
const pending = new Map();
let serial = 0, parentOrigin = "*", connected = false, record = null, proof = null, busy = false;
let decidedRequest = null;
let previewRequest = null;
function clearPreview() {
  previewRequest = null;
  el("quote").textContent = "";
  el("from").textContent = "";
  el("preview").hidden = el("actions").hidden = el("scope").hidden = true;
}
async function loadPreview(data, credential) {
  const request = data.request_id;
  previewRequest = request;
  try {
    const result = await callTool("preview_message",{message_id:data.message_id,request_id:request,proof:credential});
    if (record?.request_id !== request || previewRequest !== request) return;
    const body = result?._meta?.["ping/preview"];
    if (typeof body !== "string") throw new Error("Preview unavailable");
    el("from").textContent = "From " + data.sender;
    el("quote").textContent = body;
    el("preview").hidden = el("actions").hidden = el("scope").hidden = false;
    el("link-wrap").hidden = true;
    el("detail").textContent = "";
  } catch {
    if (record?.request_id !== request || previewRequest !== request) return;
    el("detail").textContent = "Open the message in your browser to review it.";
    el("link-wrap").hidden = !el("open").hasAttribute("href");
  }
}
function rpc(method, params) {
  const id = ++serial;
  return new Promise((resolve, reject) => {
    const timeout = setTimeout(() => { pending.delete(id); reject(new Error("Host did not respond")); }, 12000);
    pending.set(id, {resolve, reject, timeout});
    parent.postMessage({jsonrpc:"2.0", id, method, params}, parentOrigin);
  });
}
function display(result) {
  const data = result?.structuredContent;
  if (busy || (decidedRequest && data?.request_id === decidedRequest)) return;
  // Some hosts mount this resource for every read, including ordinary tool errors.
  // Only an inline approval has a card. The chat handles all other tool results.
  const legacyCard = !data?.presentation && !!result?._meta?.["ping/decisionProof"];
  el("card").hidden = data?.status !== "approval_required" || (data.presentation !== "card" && !legacyCard);
  if (el("card").hidden) {
    clearPreview();
    el("open").removeAttribute("href");
    el("link-wrap").hidden = true;
    record = null;
    proof = null;
    return;
  }
  const sameRequest = data.status === "approval_required" && record?.status === data.status &&
    data.request_id === record.request_id && data.message_id === record.message_id;
  if (!sameRequest) clearPreview();
  proof = result._meta?.["ping/decisionProof"] ?? (sameRequest ? proof : null);
  record = data;
  el("title").textContent = "Let your AI read this message?";
  el("detail").textContent = el("preview").hidden ? "From " + data.sender : "";
  const link = el("open");
  link.removeAttribute("href");
  if (data.approval_url) {
    try {
      const url = new URL(data.approval_url);
      if (url.protocol === "https:" || (url.protocol === "http:" && url.hostname === "127.0.0.1")) link.href = url.href;
    } catch {}
  }
  el("link-wrap").hidden = !link.hasAttribute("href") || !el("preview").hidden;
  if (proof && previewRequest !== data.request_id && (connected || window.openai?.callTool)) {
    loadPreview(data, proof);
  }
}
let lastHeight = -1;
function reportSize() {
  const height = Math.ceil(el("card").getBoundingClientRect().height);
  if (height === lastHeight || (!height && !el("card").hidden)) return;
  if (connected) {
    parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/size-changed",params:{height}},parentOrigin);
  } else if (window.openai?.notifyIntrinsicHeight) {
    window.openai.notifyIntrinsicHeight(height);
  } else {
    return;
  }
  lastHeight = height;
}
function applyTheme(theme) {
  if (theme === "dark" || theme === "light") document.documentElement.style.colorScheme = theme;
}
new ResizeObserver(reportSize).observe(el("card"));
function fromOpenAI() {
  applyTheme(window.openai?.theme);
  reportSize();
  const api = window.openai;
  if (!api?.toolOutput) return;
  const meta = api.toolResponseMetadata;
  display({structuredContent: api.toolOutput, _meta: meta?.mcp_tool_result?._meta ?? meta?.call_tool_result?._meta ?? meta});
}
window.addEventListener("openai:set_globals", fromOpenAI);
window.addEventListener("message", (event) => {
  if (event.source !== parent || (parentOrigin !== "*" && event.origin !== parentOrigin)) return;
  const packet = event.data;
  if (!packet || packet.jsonrpc !== "2.0") return;
  if (packet.id != null && pending.has(packet.id)) {
    if (event.origin && event.origin !== "null") parentOrigin = event.origin;
    const waiter = pending.get(packet.id);
    clearTimeout(waiter.timeout); pending.delete(packet.id);
    if (packet.error || packet.result?.isError) waiter.reject(new Error("Host rejected the request"));
    else waiter.resolve(packet.result);
  } else if (packet.method === "ui/notifications/host-context-changed") {
    applyTheme(packet.params?.theme);
  } else if (packet.method === "ui/notifications/tool-result") {
    display(packet.params);
  } else if (packet.method === "ping" && packet.id != null) {
    parent.postMessage({jsonrpc:"2.0",id:packet.id,result:{}}, parentOrigin);
  }
});
async function callTool(name, args) {
  if (connected) return rpc("tools/call", {name,arguments:args});
  return window.openai.callTool(name, args);
}
async function readInChat(reference) {
  const prompt = "Read the message from " + record.sender + " that I just approved and handle it under my instructions for this chat.";
  if (connected) {
    await rpc("ui/update-model-context", {structuredContent:reference});
    return rpc("ui/message",{role:"user",content:[{type:"text",text:prompt}]});
  }
  if (!window.openai?.setWidgetState) throw new Error("Manual follow-up required");
  await window.openai.setWidgetState(reference);
  return window.openai.sendFollowUpMessage({prompt});
}
el("actions").addEventListener("click", async (event) => {
  const decision = event.target.closest("button")?.dataset.decision;
  if (!event.isTrusted || !decision || !proof || busy) return;
  busy = true;
  for (const button of el("actions").querySelectorAll("button")) button.disabled = true;
  const {message_id,request_id} = record;
  try {
    const result = await callTool("choose_read_access",{message_id,request_id,proof,decision});
    const status = result?.structuredContent?.status;
    const expected = {allow_message:"message_allowed",once:"approved_once",always:"trusted",later:"later"};
    if (!status || status !== expected[decision]) throw new Error("Unavailable");
    decidedRequest = request_id;
    clearPreview();
    el("actions").hidden = true; el("link-wrap").hidden = true;
    if (status === "later") {
      el("title").textContent = "Request dismissed";
      el("detail").textContent = "";
    } else {
      el("title").textContent = "Access granted";
      el("detail").textContent = "";
      try {
        {{if .}}await readInChat({message_id});{{else}}await readInChat({message_id,request_id});{{end}}
        el("detail").textContent = "If your chat stops here, tell it “Read the message I approved.”";
      } catch {
        el("detail").textContent = "Tell this chat “Read the message I approved.”";
      }
    }
  } catch {
    clearPreview();
    el("link-wrap").hidden = !el("open").hasAttribute("href");
    el("detail").textContent = "Ping could not confirm your choice. Open the request in your browser or ask your AI to reopen the message.";
  } finally {
    busy = false;
    for (const button of el("actions").querySelectorAll("button")) button.disabled = false;
  }
});
el("open").addEventListener("click", (event) => {
  if (window.openai?.openExternal) {
    event.preventDefault(); window.openai.openExternal({href:el("open").href});
  } else if (connected) {
    event.preventDefault();
    rpc("ui/open-link",{url:el("open").href}).catch(() => { el("detail").textContent = "Copy the browser link on this card, or ask your AI for the approval link."; });
  }
});
fromOpenAI();
if (parent !== window) {
  rpc("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"Ping Their AI",version:"1"},appCapabilities:{}})
    .then(init => {
      connected = true;
      applyTheme(init?.hostContext?.theme);
      parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},parentOrigin);
      if (record && proof && previewRequest !== record.request_id) loadPreview(record, proof);
      lastHeight = -1;
      reportSize();
    })
    .catch(fromOpenAI);
}
</script></body></html>
